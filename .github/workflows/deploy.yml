name: Deploy

# Builds the image on GitHub's runners and publishes it to GHCR. The server
# never builds: it only pulls, which keeps a small box out of the build business
# and makes "what is running" a registry digest rather than a working copy.
#
# Two branches, two channels:
#   dev  → ghcr.io/<repo>:dev      the test bot, in the test Discord server
#   main → ghcr.io/<repo>:latest   the real bot
#
# How the server picks a new image up is deliberately not decided here — see
# docs/DEPLOYMENT.md. The default is the server polling GHCR, so nothing needs
# to be reachable from the internet.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

# Per branch: a dev push must never cancel or queue behind a main release.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve image name and channel
        id: meta
        run: |
          # GHCR rejects uppercase, and a GitHub username often has some.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Ampere/Raspberry Pi are ARM; most mini PCs and VPSs are x86. Building
      # both keeps the target a matter of which machine pulls. QEMU makes the
      # foreign half slow but correct — see docs/HOSTING-ORACLE.md § 6 for
      # dropping it in favour of a native ARM runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # The channel tag is what a server follows; the SHA tag is what makes
          # a rollback to a specific commit possible.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ steps.meta.outputs.channel }}\`"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}\`"
            echo ""
            echo "The server picks this up on its next poll (default: every 2 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional: push the release out over SSH instead of waiting for the poll.
  # Only worth enabling when the server is reachable from the internet on port
  # 22. Turn it on with a repository variable DEPLOY_MODE=ssh.
  deploy:
    name: Roll out over SSH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_MODE == 'ssh'

    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Same script the timer runs, so both paths behave identically —
            # including the health gate and the automatic rollback.
            /usr/local/bin/update-bot.sh prod

      - name: Register slash commands
        if: ${{ vars.DEPLOY_COMMANDS == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/bot-prod
            docker compose -f docker-compose.prod.yml run --rm --no-deps bot node dist/scripts/deploy-commands.js
