name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Catches a broken command definition (bad option order, name too long,
      # description over 100 chars) before it ever reaches Discord's API.
      - name: Validate slash command definitions
        run: node scripts/validate-commands.mjs

      # The serverless variant. The smoke test runs the whole Worker against a
      # fake D1 and a fake Discord, so it needs no secrets.
      - name: Typecheck the Worker
        run: npm run worker:typecheck

      - name: Test the Worker
        run: npm run worker:test

      # worker/migrations is generated from src/db/migrations.ts. A migration
      # added there without regenerating would ship a Worker with an old schema.
      - name: Check Worker migrations are up to date
        run: |
          npm run worker:migrations
          git diff --exit-code worker/migrations

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
